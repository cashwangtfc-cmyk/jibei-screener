<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉開北丸發財系統</title>
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--border:#e2e8f0;
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#eff6ff;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#dc2626;--red-l:#fee2e2;
  --amber:#d97706;--amber-l:#fef3c7;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-400:#94a3b8;--gray-500:#64748b;--gray-700:#374151;
  --radius:14px;--radius-sm:10px;
  --shadow:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 28px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--gray-100);color:#0f172a;min-height:100vh;}

.header{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#1d4ed8 100%);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;color:white;}
.logo-icon{font-size:30px;}
.logo-text h1{font-size:20px;font-weight:800;letter-spacing:.3px;}
.logo-text p{font-size:12px;opacity:.55;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:12px;}
.meta-text{font-size:12px;color:rgba(255,255,255,.5);}
.refresh-btn{padding:8px 18px;border:1.5px solid rgba(255,255,255,.25);border-radius:20px;background:rgba(255,255,255,.1);color:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px);}
.refresh-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed;}

.container{max-width:1200px;margin:0 auto;padding:24px 16px;}

.loading-box{text-align:center;padding:60px 20px;color:var(--gray-500);}
.spinner{display:inline-block;width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box p{font-size:16px;font-weight:500;margin-bottom:12px;}
.loading-box small{font-size:13px;color:var(--gray-400);}

.progress-wrap{margin:16px auto 12px;max-width:400px;}
.progress-bg{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),#6366f1);border-radius:4px;transition:width .4s ease;width:0%;}
.progress-status{font-size:12px;color:var(--gray-400);margin-top:6px;}

.error-box{background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--radius);padding:16px 20px;color:#b91c1c;font-weight:500;margin-bottom:16px;}

.section{margin-bottom:32px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.section-icon{font-size:22px;}
.section-title{font-size:18px;font-weight:800;color:#0f172a;}
.section-sub{font-size:13px;color:var(--gray-400);font-weight:400;margin-left:4px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;}

.scard{background:white;border-radius:var(--radius-sm);padding:16px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;box-shadow:var(--shadow);position:relative;text-decoration:none;display:block;color:inherit;}
.scard:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(59,130,246,.18);transform:translateY(-3px);}
.scard-rank{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:white;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.scard-rank.gold{background:#f59e0b;}
.scard-rank.silver{background:#94a3b8;}
.scard-rank.bronze{background:#b45309;}
.scard-code{font-size:11px;font-weight:700;color:var(--gray-400);font-family:monospace;letter-spacing:.5px;margin-bottom:2px;display:flex;align-items:center;gap:4px;}
.otc-badge{display:inline-block;font-size:9px;font-weight:700;background:#2563eb;color:#fff;border-radius:3px;padding:0 4px;letter-spacing:0;font-family:sans-serif;}
.scard-name{font-size:15px;font-weight:800;color:#0f172a;margin-bottom:8px;padding-right:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scard-price{font-size:22px;font-weight:900;font-family:'Courier New',monospace;line-height:1;}
.scard-chg{font-size:12px;font-weight:700;margin-top:3px;margin-bottom:10px;}
.up{color:#dc2626;}.down{color:#16a34a;}.flat{color:#94a3b8;}
.scard-divider{height:1px;background:var(--border);margin:10px 0;}
.scard-metrics{display:flex;flex-direction:column;gap:5px;}
.scard-metric{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;}
.scard-ml{color:var(--gray-500);}
.scard-mv{font-weight:700;color:#0f172a;}
.scard-mv.good{color:var(--green);}
.scard-mv.bad{color:var(--red);}
.scard-mv.warn{color:var(--amber);}

.empty{text-align:center;padding:32px;color:var(--gray-400);font-size:14px;background:white;border-radius:var(--radius-sm);border:1.5px dashed var(--border);}

.notice{background:#f0f9ff;border:1px solid #bae6fd;border-radius:var(--radius);padding:12px 16px;font-size:13px;color:#0369a1;margin-bottom:20px;}

.scard-ai{margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1;}
.scard-ai-text{font-size:10.5px;color:#475569;margin-bottom:5px;line-height:1.5;}
.scard-ai-row{display:flex;justify-content:space-between;align-items:center;}
.scard-ai-lbl{font-size:10.5px;color:var(--gray-500);}
.scard-ai-amt{font-size:13px;font-weight:900;letter-spacing:-.3px;}
.scard-ai-amt.market{color:#dc2626;}
.scard-ai-amt.limit{color:var(--blue-d);}

.history-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.history-label{font-size:13px;font-weight:600;color:var(--gray-500);flex-shrink:0;}
.history-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.htab{padding:5px 14px;border:1.5px solid var(--border);border-radius:20px;background:white;font-size:13px;font-weight:600;color:var(--gray-500);cursor:pointer;transition:all .2s;}
.htab:hover{border-color:var(--blue);color:var(--blue);}
.htab.active{background:var(--blue);border-color:var(--blue);color:white;}
.history-viewing{background:var(--amber-l);border:1px solid #fde68a;border-radius:var(--radius);padding:10px 16px;font-size:13px;color:#92400e;margin-bottom:16px;}

@media(max-width:600px){
  .header{padding:14px 12px;}
  .grid{grid-template-columns:repeat(2,1fr);}
  .section-title{font-size:16px;}
  .history-bar{gap:6px;}
  .htab{padding:4px 11px;font-size:12px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">📊</div>
    <div class="logo-text">
      <h1>吉開北丸發財系統</h1>
      <p>當沖精選 · 短期潛力 · 長期配息 · 低估掃描 · ETF精選 · ATR · ADX · OBV · 融資券</p>
    </div>
  </div>
  <div class="header-right">
    <span class="meta-text" id="meta-text"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="load(true)">🔄 重新整理</button>
  </div>
</div>

<div class="container">
  <div id="history-bar" class="history-bar" style="display:none;"></div>
  <div id="history-viewing-banner" class="history-viewing" style="display:none;"></div>
  <div id="loading" class="loading-box">
    <div class="spinner"></div>
    <p id="loading-text">正在取得市場資料…</p>
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bg"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-status" id="progress-status"></div>
    </div>
    <small>首次掃描約 1–2 分鐘，之後快取 20 分鐘</small>
  </div>
  <div id="error" class="error-box" style="display:none;"></div>
  <div id="content" style="display:none;"></div>
</div>

<script>
// ===================== HELPERS =====================
function parseNum(str) {
  if (str == null) return null;
  const s = String(str).replace(/,/g, '').trim();
  if (!s || s === '--' || s === '—' || s === 'N/A') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function timeout(ms) {
  return new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
}
async function fetchWithTimeout(url, opts = {}, ms = 12000) {
  return Promise.race([fetch(url, opts), timeout(ms)]);
}

// ===================== TECHNICAL INDICATORS =====================
function calcSMA(values, period) {
  if (values.length < period) return [];
  const result = [];
  let sum = 0;
  for (let i = 0; i < period; i++) sum += values[i];
  result.push(sum / period);
  for (let i = period; i < values.length; i++) {
    sum += values[i] - values[i - period];
    result.push(sum / period);
  }
  return result;
}

function calcEMA(values, period) {
  if (values.length < period) return [];
  const k = 2 / (period + 1);
  let ema = 0;
  for (let i = 0; i < period; i++) ema += values[i];
  ema /= period;
  const result = [ema];
  for (let i = period; i < values.length; i++) {
    ema = values[i] * k + ema * (1 - k);
    result.push(ema);
  }
  return result;
}

function calcRSI(closes, period = 14) {
  if (closes.length < period + 1) return [];
  let avgGain = 0, avgLoss = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d > 0) avgGain += d; else avgLoss -= d;
  }
  avgGain /= period; avgLoss /= period;
  const result = [avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss)];
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(d, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-d, 0)) / period;
    result.push(avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss));
  }
  return result;
}

function calcMACD(closes, fast = 12, slow = 26, sig = 9) {
  const emaF = calcEMA(closes, fast);
  const emaS = calcEMA(closes, slow);
  if (!emaF.length || !emaS.length) return null;
  const offset = (fast - 1) - (slow - 1); // emaF starts earlier: offset = slow - fast positions ahead
  // emaF[i + (slow-fast)] aligns with emaS[i]
  const diff = slow - fast;
  const macdLine = emaS.map((v, i) => emaF[i + diff] - v);
  const sigLine  = calcEMA(macdLine, sig);
  if (!sigLine.length) return null;
  const lastHist = macdLine[macdLine.length - 1] - sigLine[sigLine.length - 1];
  const prevHist = macdLine.length >= 2 && sigLine.length >= 2
    ? macdLine[macdLine.length - 2] - sigLine[sigLine.length - 2] : null;
  return { macdHist: lastHist, macdHistChange: prevHist != null ? lastHist - prevHist : null };
}

function calcStochastic(highs, lows, closes, period = 9, sigPeriod = 3) {
  if (closes.length < period + sigPeriod - 1) return null;
  const n = Math.min(closes.length, highs.length, lows.length);
  const kArr = [];
  for (let i = period - 1; i < n; i++) {
    const hh = Math.max(...highs.slice(i - period + 1, i + 1));
    const ll = Math.min(...lows.slice(i - period + 1, i + 1));
    kArr.push(hh === ll ? 50 : (closes[i] - ll) / (hh - ll) * 100);
  }
  const dArr = calcSMA(kArr, sigPeriod);
  if (!dArr.length) return null;
  const lastK = kArr[kArr.length - 1], lastD = dArr[dArr.length - 1];
  const prevK = kArr.length >= 2 ? kArr[kArr.length - 2] : null;
  const prevD = dArr.length >= 2 ? dArr[dArr.length - 2] : null;
  return {
    kdK: lastK, kdD: lastD,
    kdGolden: prevK != null && prevD != null && prevK <= prevD && lastK > lastD,
    kdDead:   prevK != null && prevD != null && prevK >= prevD && lastK < lastD,
  };
}

function calcBB(closes, period = 20) {
  if (closes.length < period) return null;
  const smaArr = calcSMA(closes, period);
  const mid = smaArr[smaArr.length - 1];
  const slice = closes.slice(closes.length - period);
  const variance = slice.reduce((s, v) => s + (v - mid) ** 2, 0) / period;
  const sd = Math.sqrt(variance);
  const upper = mid + 2 * sd, lower = mid - 2 * sd;
  const price = closes[closes.length - 1];
  const bw = upper - lower;
  return { bbPct: bw > 0 ? (price - lower) / bw : 0.5, bbWidth: bw > 0 ? bw / mid : 0 };
}

function calcATR(highs, lows, closes, period = 14) {
  const n = Math.min(closes.length, highs.length, lows.length);
  if (n < period + 1) return null;
  const trs = [];
  for (let i = 1; i < n; i++)
    trs.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  if (trs.length < period) return null;
  let atr = trs.slice(0, period).reduce((a,b) => a+b, 0) / period;
  for (let i = period; i < trs.length; i++) atr = (atr*(period-1)+trs[i])/period;
  const price = closes[closes.length-1];
  return { atr, atrPct: price > 0 ? atr/price*100 : null };
}

function calcOBV(closes, volumes) {
  if (!closes || !volumes || closes.length < 6) return null;
  const n = Math.min(closes.length, volumes.length);
  let obv = 0;
  const obvArr = [0];
  for (let i = 1; i < n; i++) {
    if (volumes[i] != null) {
      if (closes[i] > closes[i-1]) obv += volumes[i];
      else if (closes[i] < closes[i-1]) obv -= volumes[i];
    }
    obvArr.push(obv);
  }
  const last = obvArr[obvArr.length-1], prev5 = obvArr.length >= 6 ? obvArr[obvArr.length-6] : obvArr[0];
  return last > prev5 * 1.005 ? 1 : last < prev5 * 0.995 ? -1 : 0;
}

function calcADX(highs, lows, closes, period = 14) {
  const n = Math.min(closes.length, highs.length, lows.length);
  if (n < period * 2 + 1) return null;
  const plusDM = [], minusDM = [], trs = [];
  for (let i = 1; i < n; i++) {
    const up = highs[i]-highs[i-1], down = lows[i-1]-lows[i];
    plusDM.push(up > down && up > 0 ? up : 0);
    minusDM.push(down > up && down > 0 ? down : 0);
    trs.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  }
  const ws = (arr, p) => {
    let s = arr.slice(0,p).reduce((a,b)=>a+b,0);
    const r = [s];
    for (let i = p; i < arr.length; i++) { s = s-s/p+arr[i]; r.push(s); }
    return r;
  };
  const sTR = ws(trs,period), sPDM = ws(plusDM,period), sMDM = ws(minusDM,period);
  const dx = sTR.map((tr,i) => {
    if (!tr) return 0;
    const pd = 100*sPDM[i]/tr, md = 100*sMDM[i]/tr;
    return (pd+md) ? 100*Math.abs(pd-md)/(pd+md) : 0;
  });
  if (dx.length < period) return null;
  let adx = dx.slice(0,period).reduce((a,b)=>a+b,0)/period;
  for (let i = period; i < dx.length; i++) adx = (adx*(period-1)+dx[i])/period;
  const lastTR = sTR[sTR.length-1];
  const pdi = lastTR ? 100*sPDM[sPDM.length-1]/lastTR : 0;
  const mdi = lastTR ? 100*sMDM[sMDM.length-1]/lastTR : 0;
  return { adx, adxUp: pdi > mdi };
}

function calcWilliamsR(highs, lows, closes, period = 14) {
  const n = Math.min(closes.length, highs.length, lows.length);
  if (n < period) return null;
  const hh = Math.max(...highs.slice(n-period)), ll = Math.min(...lows.slice(n-period));
  if (hh === ll) return null;
  return (hh - closes[n-1]) / (hh-ll) * -100;
}

// 台股跳動單位
function tickSize(price) {
  if (price < 10)   return 0.01;
  if (price < 50)   return 0.05;
  if (price < 100)  return 0.1;
  if (price < 500)  return 0.5;
  if (price < 1000) return 1;
  return 5;
}
function tickFloor(price) {
  const t = tickSize(price);
  return Math.floor(price / t) * t;
}
// 計算「至少低於現價 minPct%」的限價（向下取到 tick）
function limitPrice(price, minPct = 1) {
  const target = price * (1 - minPct / 100);
  return parseFloat(tickFloor(target).toFixed(4));
}

function calcAISummary(s, type) {
  const parts = [];
  const price = s.close || 0;
  let orderType = '限價';
  let suggestPrice = null;

  if (type === 'dt') {
    if (s.value >= 1e9)      parts.push('成交額超十億');
    else if (s.value >= 4e8) parts.push('成交活躍');
    if (s.atrPct >= 2.5 && s.atrPct <= 5.5) parts.push(`ATR ${s.atrPct.toFixed(1)}% 理想`);
    if (s.shortChg < -100)   parts.push('融券大量回補');
    if (s.kdGolden)           parts.push('KD金叉');
    if (s.foreignNet > 0)    parts.push('外資買超');
    if (s.volRatio >= 2)     parts.push('爆量');
    if (s.obvTrend === 1)    parts.push('OBV量增');
    // 有動能訊號 → 現價追，否則掛低 0.3%（小折讓確保成交，不錯失行情）
    const dtStrong = s.kdGolden || s.volRatio >= 2 || s.atrPct >= 3 || (s.shortChg != null && s.shortChg < -100);
    if (dtStrong) {
      orderType = '現價'; suggestPrice = price;
    } else {
      orderType = '限價'; suggestPrice = limitPrice(price, 0.3);
    }
  } else if (type === 'st') {
    if (s.macdHist > 0 && s.macdHistChange > 0) parts.push('MACD多頭擴張');
    else if (s.macdHist > 0) parts.push('MACD多頭');
    if (s.kdGolden)           parts.push('KD金叉確認');
    if (s.adx >= 25 && s.adxUp) parts.push('ADX強趨勢');
    if (s.maAlign === 3)      parts.push('強多均線排列');
    if (s.obvTrend === 1)    parts.push('OBV量先行');
    if (s.foreignNet > 1e6)  parts.push('外資大舉買超');
    else if (s.foreignNet > 0) parts.push('外資買超');
    // KD金叉 或 MACD多頭+均線多排雙確認 → 現價；否則等小回掛低 1%
    if (s.kdGolden || (s.macdHist > 0 && s.maAlign >= 2)) {
      orderType = '現價'; suggestPrice = price;
    } else {
      orderType = '限價'; suggestPrice = limitPrice(price, 1);
    }
  } else if (type === 'lt') {
    if (s.dividendYield >= 6)        parts.push(`殖利率 ${s.dividendYield.toFixed(1)}% 超高`);
    else if (s.dividendYield >= 4)   parts.push(`殖利率 ${s.dividendYield.toFixed(1)}% 優異`);
    else if (s.dividendYield >= 2.5) parts.push(`殖利率 ${s.dividendYield.toFixed(1)}%`);
    if (s.peRatio > 0 && s.peRatio <= 12)     parts.push(`本益比 ${s.peRatio.toFixed(0)} 低估`);
    else if (s.peRatio > 0 && s.peRatio <= 18) parts.push(`本益比 ${s.peRatio.toFixed(0)} 合理`);
    if (s.pbRatio > 0 && s.pbRatio < 1.2)    parts.push('低於淨值');
    if (s.volatility < 1.5)                   parts.push('低波動穩定');
    if (s.foreignNet > 5e5)                   parts.push('外資持續布局');
    // 長期存股不急，等回測 3%
    orderType = '限價'; suggestPrice = limitPrice(price, 3);
  } else { // uv
    if (s.peRatio > 0 && s.peRatio < 8)        parts.push(`PE ${s.peRatio.toFixed(1)} 極低`);
    else if (s.peRatio > 0 && s.peRatio < 12)  parts.push(`PE ${s.peRatio.toFixed(1)} 偏低`);
    if (s.pbRatio > 0 && s.pbRatio < 1)        parts.push('PB低於淨值');
    else if (s.pbRatio > 0 && s.pbRatio < 1.5) parts.push(`PB ${s.pbRatio.toFixed(2)}`);
    if (s.dividendYield >= 5)                   parts.push(`殖利率 ${s.dividendYield.toFixed(1)}% 保護`);
    if (s.williamsR < -80)                      parts.push('威廉超賣');
    if (s.rsi < 35)                             parts.push('RSI超賣');
    // 低估股耐心等，掛低 2%
    orderType = '限價'; suggestPrice = limitPrice(price, 2);
  }

  return {
    text: parts.slice(0, 3).join('・') || '綜合指標達標',
    orderType, suggestPrice,
    isMarket: orderType === '現價',
  };
}

function calcTech(history) {
  const { closes, volumes, highs, lows } = history;
  if (!closes || closes.length < 15) return {};
  const t = {};
  const price = closes[closes.length - 1];

  if (closes.length >= 5)  t.ma5  = calcSMA(closes, 5).at(-1);
  if (closes.length >= 10) t.ma10 = calcSMA(closes, 10).at(-1);
  if (closes.length >= 20) t.ma20 = calcSMA(closes, 20).at(-1);
  if (closes.length >= 50) t.ma50 = calcSMA(closes, 50).at(-1);

  if (t.ma5 != null && t.ma10 != null && t.ma20 != null)
    t.maAlign = (price > t.ma5 ? 1 : 0) + (t.ma5 > t.ma10 ? 1 : 0) + (t.ma10 > t.ma20 ? 1 : 0);

  const rsiArr = calcRSI(closes, 14);
  if (rsiArr.length >= 1) {
    t.rsi = rsiArr.at(-1);
    if (rsiArr.length >= 5) t.rsiTrend = rsiArr.at(-1) - rsiArr.at(-5);
  }

  if (closes.length >= 35) {
    const m = calcMACD(closes);
    if (m) { t.macdHist = m.macdHist; t.macdHistChange = m.macdHistChange; }
  }

  if (highs && lows && closes.length >= 14) {
    const kd = calcStochastic(highs, lows, closes);
    if (kd) { t.kdK = kd.kdK; t.kdD = kd.kdD; t.kdGolden = kd.kdGolden; t.kdDead = kd.kdDead; }
  }

  if (closes.length >= 20) {
    const bb = calcBB(closes);
    if (bb) { t.bbPct = bb.bbPct; t.bbWidth = bb.bbWidth; }
  }

  if (volumes?.length >= 6) {
    const vv = volumes.filter(v => v != null);
    if (vv.length >= 6) {
      const today = vv.at(-1), avg5 = vv.slice(-6, -1).reduce((a, b) => a + b, 0) / 5;
      t.volRatio = avg5 > 0 ? today / avg5 : null;
    }
  }

  if (closes.length >= 21) {
    const sl = closes.slice(-21);
    const rets = sl.slice(1).map((c, i) => (c - sl[i]) / sl[i]);
    const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
    t.volatility = Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length) * 100;
  }

  if (highs && lows && closes.length >= 15) {
    const atrResult = calcATR(highs, lows, closes);
    if (atrResult) { t.atr = atrResult.atr; t.atrPct = atrResult.atrPct; }
  }

  if (volumes?.length >= 6) {
    const obvResult = calcOBV(closes, volumes);
    if (obvResult != null) t.obvTrend = obvResult;
  }

  if (highs && lows && closes.length >= 29) {
    const adxResult = calcADX(highs, lows, closes);
    if (adxResult) { t.adx = adxResult.adx; t.adxUp = adxResult.adxUp; }
  }

  if (highs && lows && closes.length >= 14) {
    const wr = calcWilliamsR(highs, lows, closes);
    if (wr != null) t.williamsR = wr;
  }

  t.lastClose = price;
  return t;
}

async function getTWSEDailyAll() {
  const urls = [
    'https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY_ALL?response=json',
    'https://www.twse.com.tw/exchangeReport/STOCK_DAY_ALL?response=json',
  ];
  for (const url of urls) {
    try {
      const r = await fetchWithTimeout(url, {}, 15000);
      if (!r.ok) continue;
      const json = await r.json();
      if (json.stat !== 'OK' || !json.data?.length) continue;
      const stocks = [];
      for (const row of json.data) {
        const code = row[0]?.trim();
        if (!code) continue;
        const close  = parseNum(row[7]);
        const volume = parseNum(row[2]);
        if (!close || !volume || close < 2) continue;
        const open  = parseNum(row[4]) || close;
        const high  = parseNum(row[5]) || close;
        const low   = parseNum(row[6]) || close;
        const value = parseNum(row[3]);
        const changeAmt = parseNum(row[8]?.trim() || '0') || 0;
        const prevClose = close - changeAmt;
        const changePct = prevClose > 0 ? parseFloat((changeAmt / prevClose * 100).toFixed(2)) : 0;
        const changeDir = changeAmt > 0 ? '+' : changeAmt < 0 ? '-' : '';
        stocks.push({ code, name: row[1]?.trim() || code, volume, value, open, high, low, close, changeDir, changeAmt, changePct });
      }
      if (stocks.length > 100) return { stocks, date: json.date || null };
    } catch {}
  }
  return { stocks: [], date: null };
}

async function fetchHistory(code) {
  const ticker = code.includes('.') ? code : code + '.TW';
  try {
    const r = await fetchWithTimeout(
      `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=6mo&interval=1d&includePrePost=false`,
      {}, 10000
    );
    if (!r.ok) return null;
    const json = await r.json();
    const q = json?.chart?.result?.[0]?.indicators?.quote?.[0];
    if (!q?.close) return null;
    const closes = [], volumes = [], highs = [], lows = [];
    for (let i = 0; i < q.close.length; i++) {
      if (q.close[i] != null && !isNaN(q.close[i])) {
        closes.push(q.close[i]);
        volumes.push(q.volume?.[i] ?? null);
        highs.push(q.high?.[i]  ?? q.close[i]);
        lows.push(q.low?.[i]   ?? q.close[i]);
      }
    }
    return closes.length >= 15 ? { closes, volumes, highs, lows } : null;
  } catch { return null; }
}

// ===================== SCORING =====================
function scoreDayTrade(s) {
  let sc = 0;
  const { close, open, high, low, value, changeDir, rsi, kdK, kdGolden, volRatio, foreignNet, trustNet,
          atrPct, obvTrend, marginNet, shortChg } = s;
  if (!value || value < 5e7) return -99;
  if (value >= 3e9) sc += 35; else if (value >= 1e9) sc += 28; else if (value >= 4e8) sc += 20; else if (value >= 1e8) sc += 12; else sc += 4;
  const range = open > 0 ? (high - low) / open * 100 : 0;
  if (range >= 6) sc += 22; else if (range >= 4) sc += 16; else if (range >= 3) sc += 10; else if (range >= 2) sc += 5; else if (range < 1) sc -= 10;
  // ATR% 比振幅更穩定的波動評估
  if (atrPct != null) { if (atrPct >= 2.5 && atrPct <= 5.5) sc += 18; else if (atrPct >= 1.5) sc += 10; else if (atrPct < 1) sc -= 12; else if (atrPct > 7) sc -= 6; }
  if (close >= 15 && close <= 250) sc += 15; else if (close >= 8) sc += 6;
  if (changeDir === '+') sc += 8; else if (changeDir === '-') sc += 4;
  if (rsi != null) { if (rsi >= 40 && rsi <= 68) sc += 15; else if (rsi >= 30 && rsi <= 75) sc += 5; else sc -= 10; }
  if (volRatio != null) { if (volRatio >= 2) sc += 12; else if (volRatio >= 1.5) sc += 8; else if (volRatio >= 1.2) sc += 4; else if (volRatio < 0.7) sc -= 8; }
  if (kdK != null) { if (kdK < 20) sc += 5; else if (kdK <= 75) sc += 5; else sc -= 8; }
  if (kdGolden) sc += 8;
  // OBV 量價確認
  if (obvTrend === 1) sc += 8; else if (obvTrend === -1) sc -= 5;
  // 融資：淨增加代表散戶追高，券空回補代表軋空機會
  if (marginNet != null) { if (marginNet > 500) sc += 5; else if (marginNet < -500) sc -= 3; }
  if (shortChg != null && shortChg < -100) sc += 8; // 融券大量回補 = 軋空訊號
  if (foreignNet != null && foreignNet > 0) sc += 8;
  if (trustNet   != null && trustNet   > 0) sc += 6;
  return sc;
}

function scoreShortTerm(s) {
  let sc = 0;
  const { close, value, changeDir, ma20, ma50, rsi, rsiTrend, macdHist, macdHistChange, peRatio,
          kdK, kdGolden, kdDead, maAlign, volRatio, bbPct, foreignNet, trustNet,
          adx, adxUp, obvTrend } = s;
  if (!value || value < 3e7) return -99;
  if (rsi != null) { if (rsi >= 50 && rsi <= 65) sc += 25; else if (rsi >= 40 && rsi < 50) sc += 18; else if (rsi >= 30 && rsi < 40) sc += 10; else if (rsi > 65 && rsi <= 72) sc += 8; else if (rsi > 72) sc -= 15; }
  if (rsiTrend != null) { if (rsiTrend > 5) sc += 18; else if (rsiTrend > 0) sc += 8; }
  if (macdHist != null) { if (macdHist > 0) sc += 15; if (macdHistChange > 0) sc += 12; }
  if (ma20 != null && close > ma20) sc += 20;
  if (ma50 != null && close > ma50) sc += 10;
  if (changeDir === '+') sc += 8;
  if (peRatio != null && peRatio > 0 && peRatio <= 20) sc += 8;
  if (kdGolden) sc += 18;
  else if (kdDead) sc -= 15;
  else if (kdK != null) { if (kdK >= 20 && kdK <= 70) sc += 5; else if (kdK > 80) sc -= 8; }
  if (maAlign != null) { if (maAlign === 3) sc += 15; else if (maAlign === 2) sc += 8; else if (maAlign === 0) sc -= 8; }
  if (volRatio != null) { if (volRatio >= 1.5) sc += 10; else if (volRatio >= 1.2) sc += 5; else if (volRatio < 0.7) sc -= 5; }
  if (bbPct != null) { if (bbPct < 0.3) sc += 10; else if (bbPct < 0.6) sc += 5; else if (bbPct > 0.85) sc -= 10; }
  // ADX 趨勢強度：過濾橫盤假訊號
  if (adx != null) { if (adx >= 25 && adxUp) sc += 22; else if (adx >= 20 && adxUp) sc += 12; else if (adx >= 15 && adxUp) sc += 6; else if (adx < 15) sc -= 12; }
  // OBV 量價確認：量先行於價
  if (obvTrend === 1) sc += 15; else if (obvTrend === -1) sc -= 12;
  if (foreignNet != null) {
    if (foreignNet > 1000000) sc += 25; else if (foreignNet > 200000) sc += 18; else if (foreignNet > 0) sc += 10;
    else if (foreignNet < -1000000) sc -= 12; else if (foreignNet < 0) sc -= 5;
  }
  if (trustNet != null) {
    if (trustNet > 200000) sc += 18; else if (trustNet > 50000) sc += 12; else if (trustNet > 0) sc += 6;
    else if (trustNet < -200000) sc -= 10; else if (trustNet < 0) sc -= 4;
  }
  return sc;
}

function scoreLongTerm(s) {
  let sc = 0;
  const { close, value, dividendYield, peRatio, pbRatio, ma50, rsi, volatility, maAlign, bbWidth, foreignNet, trustNet, obvTrend } = s;
  if (!value || value < 1e7) return -99;
  if (dividendYield >= 6) sc += 40; else if (dividendYield >= 4) sc += 30; else if (dividendYield >= 2.5) sc += 15; else if (!dividendYield || dividendYield < 1) sc -= 10;
  if (peRatio > 0) { if (peRatio <= 10) sc += 25; else if (peRatio <= 15) sc += 18; else if (peRatio <= 20) sc += 10; else if (peRatio > 30) sc -= 10; }
  if (pbRatio > 0) { if (pbRatio <= 1.2) sc += 20; else if (pbRatio <= 2) sc += 12; else if (pbRatio > 3) sc -= 5; }
  if (volatility != null) { if (volatility < 1.2) sc += 15; else if (volatility < 2) sc += 8; else if (volatility > 4) sc -= 8; }
  if (ma50 != null && close > ma50) sc += 10;
  if (rsi != null && rsi >= 40 && rsi <= 65) sc += 5;
  if (maAlign != null) { if (maAlign === 3) sc += 10; else if (maAlign >= 2) sc += 5; }
  if (bbWidth != null && bbWidth < 0.1) sc += 5;
  if (obvTrend === 1) sc += 5; else if (obvTrend === -1) sc -= 3;
  if (foreignNet != null) {
    if (foreignNet > 500000) sc += 15; else if (foreignNet > 0) sc += 8; else if (foreignNet < -1000000) sc -= 10;
  }
  if (trustNet != null && trustNet > 0) sc += 5;
  return sc;
}

function scoreUndervalued(s) {
  let sc = 0;
  const { peRatio, pbRatio, dividendYield, rsi } = s;
  if (peRatio != null && peRatio > 0) {
    if      (peRatio < 8)  sc += 35;
    else if (peRatio < 12) sc += 28;
    else if (peRatio < 15) sc += 20;
    else if (peRatio < 20) sc += 10;
    else if (peRatio < 25) sc += 3;
  }
  if (pbRatio != null && pbRatio > 0) {
    if      (pbRatio < 0.8) sc += 25;
    else if (pbRatio < 1.2) sc += 20;
    else if (pbRatio < 1.5) sc += 14;
    else if (pbRatio < 2.0) sc += 7;
    else if (pbRatio < 3.0) sc += 2;
  }
  if (dividendYield != null && dividendYield > 0) {
    if      (dividendYield >= 7) sc += 25;
    else if (dividendYield >= 5) sc += 20;
    else if (dividendYield >= 4) sc += 14;
    else if (dividendYield >= 3) sc += 9;
    else if (dividendYield >= 2) sc += 3;
  }
  if (rsi != null) {
    if      (rsi < 30) sc += 12;
    else if (rsi < 40) sc += 8;
    else if (rsi < 50) sc += 4;
  }
  // Williams %R：深度超賣代表極度低估、潛在反彈機會
  if (s.williamsR != null) {
    if      (s.williamsR < -90) sc += 15;
    else if (s.williamsR < -80) sc += 10;
    else if (s.williamsR < -60) sc += 5;
    else if (s.williamsR > -20) sc -= 5;
  }
  return sc;
}

// ===================== CACHE =====================
const CACHE_KEY = 'jibei_screener_v4';
const CACHE_TTL = 20 * 60 * 1000;

function getCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem(CACHE_KEY); return null; }
    return data;
  } catch { return null; }
}

function setCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

// ===================== MAIN SCREENER =====================
async function screenStocks(onProgress) {
  const cached = getCache();
  if (cached) return cached;

  onProgress(2, '取得大盤行情資料…');
  const [{ stocks: daily, date: dataDate }, fundMap, instMap, marginMap, tpexFundMap] = await Promise.all([
    getTWSEDailyAll(), getTWSEFundamentalsAll(), getTWSEInstitutional(), getTWSEMarginData(), getTPEXFundamentalsAll()
  ]);

  if (daily.length === 0) throw new Error('無法取得 TWSE 資料，請稍後再試');

  onProgress(12, `取得 ${daily.length} 檔資料，建立評分候選…`);

  const merged = daily.map(s => ({
    ...s,
    dividendYield: fundMap.get(s.code)?.dividendYield ?? null,
    peRatio:       fundMap.get(s.code)?.peRatio ?? null,
    pbRatio:       fundMap.get(s.code)?.pbRatio ?? null,
    reportPeriod:  fundMap.get(s.code)?.reportPeriod ?? null,
    foreignNet:    instMap.get(s.code)?.foreignNet ?? null,
    trustNet:      instMap.get(s.code)?.trustNet   ?? null,
    dealerNet:     instMap.get(s.code)?.dealerNet  ?? null,
    totalNet:      instMap.get(s.code)?.totalNet   ?? null,
    marginNet:     marginMap.get(s.code)?.marginNet ?? null,
    marginChg:     marginMap.get(s.code)?.marginChg ?? null,
    shortChg:      marginMap.get(s.code)?.shortChg  ?? null,
  }));

  // 建立上櫃虛擬候選（無成交量，只加入長期/低估類別）
  const tpexStocks = [];
  for (const [code, fund] of tpexFundMap) {
    if (!fund.dividendYield && !fund.peRatio && !fund.pbRatio) continue;
    tpexStocks.push({
      code: code + '.TWO', name: fund.name,
      close: 0, open: 0, high: 0, low: 0, value: 1e8,
      changePct: 0, changeDir: '',
      dividendYield: fund.dividendYield, peRatio: fund.peRatio, pbRatio: fund.pbRatio,
      reportPeriod: null, foreignNet: null, trustNet: null, dealerNet: null,
      totalNet: null, marginNet: null, marginChg: null, shortChg: null,
      isOTC: true,
    });
  }
  const allMerged = [...merged, ...tpexStocks];

  const byValue = [...merged].sort((a, b) => (b.value||0) - (a.value||0));
  const dtCodes = byValue.slice(0, 60).map(s => s.code);
  const stCodes = byValue.filter(s => s.close >= 8).slice(0, 80).map(s => s.code);
  const ltCodes = allMerged
    .filter(s => s.dividendYield > 1.5 && (s.peRatio == null || (s.peRatio > 0 && s.peRatio < 40)))
    .sort((a, b) => (b.dividendYield||0) - (a.dividendYield||0))
    .slice(0, 60).map(s => s.code);
  const uvCodes = allMerged
    .filter(s => {
      const baseCode = s.code.replace(/\.(TW|TWO)$/, '');
      if (!s.isOTC && !/^[1-9]\d{3}$/.test(baseCode)) return false;
      const pe = s.peRatio, pb = s.pbRatio, yl = s.dividendYield;
      if (!pe && !pb && !yl) return false;
      if (pe != null && (pe <= 0 || pe > 100)) return false;
      if (pb != null && (pb <= 0 || pb > 50)) return false;
      return scoreUndervalued(s) >= 20;
    })
    .sort((a, b) => scoreUndervalued(b) - scoreUndervalued(a))
    .slice(0, 60).map(s => s.code);

  // ETF 候選：stock 型 + bond 型（排除槓桿/反向）
  const etfBaseCodes = Object.keys(ETF_INFO).filter(c => ETF_INFO[c].type === 'equity' || ETF_INFO[c].type === 'bond');
  const etfTWCodes   = etfBaseCodes.map(c => c + '.TW');

  const allCodes = [...new Set([...dtCodes, ...stCodes, ...ltCodes, ...uvCodes, ...etfTWCodes])];

  const techMap = new Map();
  const total = allCodes.length;
  let done = 0;
  const BATCH = 5;
  for (let i = 0; i < allCodes.length; i += BATCH) {
    await Promise.allSettled(allCodes.slice(i, i + BATCH).map(async code => {
      const hist = await fetchHistory(code);
      if (hist) techMap.set(code, calcTech(hist));
      done++;
    }));
    const pct = 12 + Math.round(done / total * 75);
    onProgress(pct, `技術分析 ${done} / ${total} 檔`);
    if (i + BATCH < allCodes.length) await new Promise(r => setTimeout(r, 180));
  }

  onProgress(90, '計算排名…');

  const codeMap = new Map([
    ...merged.map(s => [s.code, s]),
    ...tpexStocks.map(s => [s.code, s]),
  ]);
  const enrich = code => {
    const base = codeMap.get(code) || {};
    const tech = techMap.get(code) || {};
    const enriched = { ...base, ...tech };
    if (base.isOTC && tech.lastClose) enriched.close = tech.lastClose;
    return enriched;
  };

  const dayTrade    = dtCodes.map(c => ({ ...enrich(c), _score: scoreDayTrade(enrich(c)) })).filter(s => s._score > 10).sort((a, b) => b._score - a._score).slice(0, 10);
  const shortTerm   = stCodes.map(c => ({ ...enrich(c), _score: scoreShortTerm(enrich(c)) })).filter(s => s._score > 15).sort((a, b) => b._score - a._score).slice(0, 10);
  const longTerm    = ltCodes.map(c => ({ ...enrich(c), _score: scoreLongTerm(enrich(c)) })).filter(s => s._score > 20).sort((a, b) => b._score - a._score).slice(0, 10);
  const undervalued = uvCodes.map(c => ({ ...enrich(c), _score: scoreUndervalued(enrich(c)) })).filter(s => s._score > 0).sort((a, b) => b._score - a._score).slice(0, 10);

  // ETF 精選評分（殖利率為主 + 費率加分）
  const etfRanked = etfTWCodes.map(twCode => {
    const baseCode = twCode.replace('.TW', '');
    const info = ETF_INFO[baseCode];
    const fd   = fundMap.get(baseCode);
    const tech = techMap.get(twCode) || {};
    const yld  = fd?.dividendYield ?? null;
    if (!yld) return null;
    let score = 0;
    if (yld >= 6)       score += 50;
    else if (yld >= 5)  score += 40;
    else if (yld >= 4)  score += 30;
    else if (yld >= 3)  score += 20;
    else if (yld >= 2)  score += 10;
    if (info.expenseRatio <= 0.3) score += 15;
    else if (info.expenseRatio <= 0.5) score += 10;
    else if (info.expenseRatio <= 0.8) score += 5;
    if (tech.rsi != null && tech.rsi >= 45 && tech.rsi <= 70) score += 8;
    if (tech.macd?.value > 0 && tech.macd?.histogram > 0) score += 5;
    return {
      code: twCode, name: fd?.chineseName || info.name || baseCode,
      close: tech.lastClose ?? 0, changePct: 0, changeDir: '',
      dividendYield: yld, peRatio: fd?.peRatio ?? null, pbRatio: fd?.pbRatio ?? null,
      isETF: true, etfInfo: info,
      ...tech, _score: score,
    };
  }).filter(Boolean).sort((a, b) => b._score - a._score).slice(0, 10);

  const result = { dayTrade, shortTerm, longTerm, undervalued, etfRanked, updatedAt: new Date().toISOString(), dataDate };
  setCache(result);
  onProgress(100, '完成！');
  return result;
}

// ===================== UI =====================
function section(icon, title, sub, stocks, type) {
  const cards = stocks?.length
    ? stocks.map((s, i) => card(s, i + 1, type)).join('')
    : `<div class="empty">今日無符合條件的股票</div>`;
  return `<div class="section">
    <div class="section-head">
      <span class="section-icon">${icon}</span>
      <span class="section-title">${title}</span>
      <span class="section-sub">${sub}</span>
    </div>
    <div class="grid">${cards}</div>
  </div>`;
}

const ANALYSIS_URL = 'https://cashwangtfc-cmyk.github.io/cash-stock-analysis/';

function card(s, rank, type) {
  const up = s.changePct > 0, dn = s.changePct < 0;
  const cls = up ? 'up' : dn ? 'down' : 'flat';
  const arrow = up ? '▲' : dn ? '▼' : '—';
  const sign = up ? '+' : '';
  const rankCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
  const valStr = s.value ? s.value >= 1e9 ? (s.value/1e9).toFixed(1)+'億' : (s.value/1e8).toFixed(1)+'億' : '—';
  const range  = s.open > 0 ? ((s.high - s.low) / s.open * 100).toFixed(1) + '%' : '—';
  const rsiCls = s.rsi == null ? '' : s.rsi > 70 ? 'bad' : s.rsi < 35 ? 'warn' : 'good';
  const fmt = (v, d = 1) => v != null ? parseFloat(v.toFixed(d)) : null;
  const mv  = (label, val, c = '') => val != null
    ? `<div class="scard-metric"><span class="scard-ml">${label}</span><span class="scard-mv ${c}">${val}</span></div>` : '';

  const kdTag = s.kdK != null
    ? (s.kdGolden ? `金叉 K${s.kdK.toFixed(0)}` : s.kdDead ? `死叉 K${s.kdK.toFixed(0)}` : `K${s.kdK.toFixed(0)}/D${s.kdD?.toFixed(0)}`)
    : null;
  const kdCls = s.kdGolden ? 'good' : s.kdDead ? 'bad' : s.kdK > 80 ? 'warn' : '';
  const volRatioStr = s.volRatio != null ? s.volRatio.toFixed(2) + 'x' : null;
  const volCls = s.volRatio >= 2 ? 'good' : s.volRatio < 0.7 ? 'bad' : '';
  const fmtInst = v => {
    if (v == null) return null;
    const lots = Math.round(v / 1000);
    if (lots === 0) return '持平';
    const abs = Math.abs(lots), sg = lots > 0 ? '+' : '-';
    if (abs >= 10000) return sg + (abs/10000).toFixed(1) + '萬張';
    if (abs >= 1000)  return sg + (abs/1000).toFixed(1) + '千張';
    return sg + abs + '張';
  };
  const instCls = v => v == null ? '' : v > 0 ? 'good' : v < 0 ? 'bad' : '';

  let metrics = '';
  if (type === 'dt') {
    const atrTag = s.atrPct != null ? s.atrPct.toFixed(1)+'%' : null;
    const atrCls = s.atrPct >= 2.5 && s.atrPct <= 5.5 ? 'good' : s.atrPct < 1 ? 'bad' : '';
    const marginStr = s.marginNet != null ? (s.marginNet > 0 ? '+' : '') + s.marginNet + '張' : null;
    const marginCls = s.marginNet < -200 ? 'warn' : s.marginNet > 500 ? '' : '';
    const shortChgStr = s.shortChg != null && s.shortChg !== 0
      ? (s.shortChg > 0 ? '+' : '') + s.shortChg + '張' : null;
    const shortChgCls = s.shortChg != null && s.shortChg < -100 ? 'good' : s.shortChg > 100 ? 'bad' : '';
    metrics = [
      mv('成交金額', valStr),
      mv('ATR%',   atrTag, atrCls),
      mv('量比',   volRatioStr, volCls),
      mv('RSI',    fmt(s.rsi, 1), rsiCls),
      mv('KD',     kdTag, kdCls),
      mv('融資',   marginStr, marginCls),
      mv('融券變化', shortChgStr, shortChgCls),
      mv('外資',   fmtInst(s.foreignNet), instCls(s.foreignNet)),
    ].join('');
  } else if (type === 'st') {
    const macdTag = s.macdHist != null ? (s.macdHist > 0 ? '多頭' : '空頭') : null;
    const macdCls = s.macdHist != null ? (s.macdHist > 0 ? 'good' : 'bad') : '';
    const maAlignTag = s.maAlign != null ? ['空頭排列','弱勢','多頭趨勢','強多排列'][s.maAlign] : null;
    const maAlignCls = s.maAlign === 3 ? 'good' : s.maAlign === 0 ? 'bad' : '';
    const adxTag = s.adx != null
      ? (s.adx >= 25 ? '強趨勢' : s.adx >= 20 ? '趨勢中' : '震盪') + ` ${s.adx.toFixed(0)}`
      : null;
    const adxCls = s.adx >= 25 && s.adxUp ? 'good' : s.adx < 15 ? 'bad' : '';
    const obvTag = s.obvTrend === 1 ? '量增↑' : s.obvTrend === -1 ? '量縮↓' : s.obvTrend === 0 ? '持平' : null;
    const obvCls = s.obvTrend === 1 ? 'good' : s.obvTrend === -1 ? 'bad' : '';
    metrics = [
      mv('RSI',    fmt(s.rsi, 1), rsiCls),
      mv('KD',     kdTag, kdCls),
      mv('MACD',   macdTag, macdCls),
      mv('ADX',    adxTag, adxCls),
      mv('OBV',    obvTag, obvCls),
      mv('均線排列', maAlignTag, maAlignCls),
      mv('外資',   fmtInst(s.foreignNet), instCls(s.foreignNet)),
    ].join('');
  } else if (type === 'uv') {
    const yCls  = s.dividendYield >= 5 ? 'good' : s.dividendYield >= 3 ? '' : 'warn';
    const peCls = s.peRatio > 0 && s.peRatio < 12 ? 'good' : s.peRatio > 0 && s.peRatio <= 20 ? '' : 'bad';
    const pbCls = s.pbRatio > 0 && s.pbRatio < 1.2 ? 'good' : s.pbRatio > 0 && s.pbRatio <= 2 ? '' : 'bad';
    const wrStr = s.williamsR != null ? s.williamsR.toFixed(0) : null;
    const wrCls = s.williamsR != null && s.williamsR < -80 ? 'good' : s.williamsR != null && s.williamsR > -20 ? 'bad' : '';
    metrics = [
      mv('殖利率', s.dividendYield != null ? s.dividendYield.toFixed(2)+'%' : null, yCls),
      mv('本益比', fmt(s.peRatio, 1), peCls),
      mv('股淨比', fmt(s.pbRatio, 2), pbCls),
      mv('RSI',    fmt(s.rsi, 1), rsiCls),
      mv('威廉%R', wrStr, wrCls),
      mv('評分',   s._score != null ? s._score + '分' : null, 'good'),
      mv('財報期', s.reportPeriod || null),
    ].join('');
  } else {
    const yCls  = s.dividendYield >= 4 ? 'good' : s.dividendYield >= 2.5 ? '' : 'warn';
    const peCls = s.peRatio > 0 && s.peRatio <= 15 ? 'good' : '';
    const pbCls = s.pbRatio > 0 && s.pbRatio <= 1.5 ? 'good' : '';
    metrics = [
      mv('殖利率', s.dividendYield != null ? s.dividendYield.toFixed(2)+'%' : null, yCls),
      mv('本益比', fmt(s.peRatio, 1), peCls),
      mv('股淨比', fmt(s.pbRatio, 2), pbCls),
      mv('波動率', s.volatility != null ? s.volatility.toFixed(2)+'%' : null),
      mv('外資',   fmtInst(s.foreignNet), instCls(s.foreignNet)),
    ].join('');
  }

  const ai = calcAISummary(s, type);
  const priceStr = ai.isMarket
    ? `<span class="scard-ai-amt market">現價買入</span>`
    : `<span class="scard-ai-amt limit">限價 ${ai.suggestPrice}</span>`;
  const aiSection = `<div class="scard-ai">
    <div class="scard-ai-text">💡 ${ai.text}</div>
    <div class="scard-ai-row">
      <span class="scard-ai-lbl">下單建議</span>
      ${priceStr}
    </div>
  </div>`;

  const displayCode = s.code.replace(/\.(TW|TWO)$/, '');
  const otcBadge = s.isOTC ? `<span class="otc-badge">上櫃</span>` : '';
  return `<div class="scard" onclick="window.open('${ANALYSIS_URL}?q=${s.code}')" title="點擊查看 ${s.name} 詳細分析">
    <div class="scard-rank ${rankCls}">${rank}</div>
    <div class="scard-code">${displayCode}${otcBadge}</div>
    <div class="scard-name">${s.name}</div>
    <div class="scard-price ${cls}">NT$${(s.close||0).toLocaleString()}</div>
    <div class="scard-chg ${cls}">${arrow} ${sign}${s.changePct}%</div>
    <div class="scard-divider"></div>
    <div class="scard-metrics">${metrics}</div>
    ${aiSection}
  </div>`;
}

// ===================== HISTORY =====================
const HISTORY_KEY = 'jibei_history';

function saveHistory(result) {
  try {
    const today = new Date().toISOString().split('T')[0];
    const raw = localStorage.getItem(HISTORY_KEY);
    const history = raw ? JSON.parse(raw) : [];
    const filtered = history.filter(h => h.date !== today).slice(0, 4);
    filtered.unshift({ date: today, dataDate: result.dataDate, data: result });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(filtered));
  } catch {}
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
}

let _viewingDate = null;

function renderHistoryTabs(activeDate) {
  const history = getHistory();
  if (history.length === 0) {
    document.getElementById('history-bar').style.display = 'none';
    return;
  }
  _viewingDate = activeDate;
  const today = new Date().toISOString().split('T')[0];
  const tabs = history.map(h => {
    const d = new Date(h.date + 'T00:00:00');
    const label = h.date === today ? '今日' : `${d.getMonth()+1}/${d.getDate()}`;
    const active = h.date === activeDate;
    return `<button class="htab${active?' active':''}" onclick="loadHistoryDate('${h.date}')">${label}</button>`;
  }).join('');
  document.getElementById('history-bar').innerHTML =
    `<span class="history-label">📅 歷史紀錄</span><div class="history-tabs">${tabs}</div>`;
  document.getElementById('history-bar').style.display = 'flex';

  const banner = document.getElementById('history-viewing-banner');
  if (activeDate && activeDate !== today) {
    const d = new Date(activeDate + 'T00:00:00');
    banner.textContent = `⚠ 正在查看 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 的選股結果（歷史資料）`;
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

function loadHistoryDate(date) {
  const entry = getHistory().find(h => h.date === date);
  if (!entry) return;
  renderHistoryTabs(date);
  showResult(entry.data);
}

function etfCard(s, rank) {
  const info = s.etfInfo || {};
  const rankCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
  const yldCls  = s.dividendYield >= 5 ? 'good' : s.dividendYield >= 3 ? '' : 'warn';
  const feeColor = info.expenseRatio <= 0.3 ? 'var(--green)' : info.expenseRatio >= 1 ? 'var(--red)' : 'var(--amber)';
  const rsiCls = s.rsi == null ? '' : s.rsi > 70 ? 'bad' : s.rsi < 35 ? 'warn' : 'good';
  const mv = (label, val, cls = '') => val != null
    ? `<div class="scard-metric"><span class="scard-ml">${label}</span><span class="scard-mv ${cls}">${val}</span></div>` : '';
  const ticker = s.code.replace('.TW', '');
  return `<a class="scard" href="https://cashwangtfc-cmyk.github.io/cash-stock-analysis/?q=${ticker}" target="_blank" rel="noopener">
    <div class="scard-rank ${rankCls}">${rank}</div>
    <div class="scard-code"><span style="font-size:9px;font-weight:700;background:#7c3aed;color:#f5f3ff;border-radius:3px;padding:0 4px;">ETF</span> ${ticker}</div>
    <div class="scard-name" title="${s.name}">${s.name}</div>
    <div class="scard-price" style="font-size:18px;">${s.close > 0 ? 'NT$' + s.close.toFixed(2) : '—'}</div>
    <div style="font-size:10.5px;color:var(--gray-400);margin:3px 0 8px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${info.trackingIndex||''}">${info.category||'—'} · ${info.fundFamily||'—'}</div>
    <div class="scard-divider"></div>
    <div class="scard-metrics">
      ${mv('殖利率', s.dividendYield != null ? s.dividendYield + '%' : null, yldCls)}
      <div class="scard-metric"><span class="scard-ml">費用率</span><span class="scard-mv" style="color:${feeColor};">${info.expenseRatio != null ? info.expenseRatio + '%/年' : '—'}</span></div>
      ${mv('RSI', s.rsi != null ? s.rsi.toFixed(1) : null, rsiCls)}
      ${s.peRatio != null ? mv('殖息倍數', s.peRatio.toFixed(1), '') : ''}
    </div>
    <div style="margin-top:8px;font-size:9.5px;color:var(--gray-400);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${info.trackingIndex||''}">追蹤：${info.trackingIndex||'—'}</div>
  </a>`;
}

function showResult(data) {
  const dateStr = data.dataDate
    ? `資料：${data.dataDate.slice(0,4)}/${data.dataDate.slice(4,6)}/${data.dataDate.slice(6,8)}`
    : '';
  const updStr = data.updatedAt
    ? `更新：${new Date(data.updatedAt).toLocaleString('zh-TW', { hour12: false })}`
    : '';
  document.getElementById('meta-text').textContent = [dateStr, updStr].filter(Boolean).join('　');

  const etfList = data.etfRanked || [];
  const etfHtml = etfList.length
    ? etfList.map((s, i) => etfCard(s, i + 1)).join('')
    : `<div class="empty">ETF 殖利率資料尚未取得</div>`;
  const etfSection = `<div class="section">
    <div class="section-head">
      <span class="section-icon">📦</span>
      <span class="section-title">ETF 精選</span>
      <span class="section-sub">殖利率 + 低費率綜合排名（排除槓桿/反向型）</span>
    </div>
    <div class="grid">${etfHtml}</div>
  </div>`;

  document.getElementById('content').innerHTML =
    `<div class="notice">⚡ 點擊股票卡片，前往「Cash賺錢錢」查看 AI 詳細分析</div>` + [
      section('🔥', '當沖精選', '今日振幅大、成交活躍', data.dayTrade, 'dt'),
      section('📈', '短期上漲潛力', 'RSI 健康 + MACD 多頭 + 站上均線', data.shortTerm, 'st'),
      section('💎', '長期穩定配息', '高殖利率 + 合理本益比 + 低波動', data.longTerm, 'lt'),
      section('🔍', '被低估台股', 'PE + PB + 殖利率 + RSI 綜合評分', data.undervalued, 'uv'),
      etfSection,
    ].join('');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// ===================== LOAD =====================
function setProgress(pct, status) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-status').textContent = status;
  if (pct > 0 && pct < 100) {
    document.getElementById('progress-wrap').style.display = 'block';
    document.getElementById('loading-text').textContent = '正在掃描全市場技術指標…';
  }
}

async function load(force = false) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('loading-text').textContent = '正在取得市場資料…';
  document.getElementById('progress-fill').style.width = '0%';
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;

  if (force) { try { localStorage.removeItem(CACHE_KEY); } catch {} }

  try {
    const data = await screenStocks(setProgress);
    saveHistory(data);
    const today = new Date().toISOString().split('T')[0];
    showResult(data);
    renderHistoryTabs(today);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = '錯誤：' + e.message;
  } finally {
    btn.disabled = false;
  }
}

load();
</script>
